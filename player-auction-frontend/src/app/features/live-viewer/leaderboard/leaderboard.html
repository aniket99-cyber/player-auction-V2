<div class="leaderboard">
  <h3 class="leaderboard__title">Leaderboard</h3>
  <div class="leaderboard__list">
    @for (player of ranked(); track player.id) {
      <div
        class="leaderboard__row"
        [class.leaderboard__row--active]="player.id === highlightedPlayerId()"
        [class.leaderboard__row--top]="player.rank === 1"
      >
        <span class="leaderboard__rank">{{ player.rank }}</span>

        <div class="leaderboard__player-avatar">
          @if (player.imageUrl) {
            <img [src]="player.imageUrl" [alt]="player.name" />
          } @else {
            <span>{{ player.name.charAt(0) }}</span>
          }
        </div>

        <div class="leaderboard__info">
          <span class="leaderboard__name">{{ player.name }}</span>
          <div class="leaderboard__team-tag">
            @if (player.teamLogoUrl) {
              <img [src]="player.teamLogoUrl" [alt]="player.teamName || ''" class="leaderboard__team-logo" />
            }
            <span class="leaderboard__team-name">{{ player.teamName || 'Sold Player' }}</span>
          </div>
        </div>

        <div class="leaderboard__price-block">
          <span class="leaderboard__spent">{{ player.soldPrice }}</span>
          <span class="leaderboard__unit">pts</span>
        </div>
      </div>
    } @empty {
      <div class="leaderboard__empty">
        <span>No players sold yet</span>
      </div>
    }
  </div>
</div>
