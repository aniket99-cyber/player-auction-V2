<div class="teams-panel">
  <h3 class="teams-panel__title">Teams</h3>
  <div class="teams-panel__list">
    @for (team of teams(); track team.id) {
      <app-team-field-card
        [team]="team"
        [roster]="rosterFor(team)"
        [isActive]="team.id === activeTeamId()"
      />
    }
  </div>
</div>
