<div class="deleted-teams">
  <div class="deleted-teams__header">
    <button mat-icon-button routerLink="/teams" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Deleted Teams</h1>
  </div>

  @if (isLoading()) {
    <p class="deleted-teams__loading">Loading...</p>
  } @else if (teams().length === 0) {
    <p class="deleted-teams__empty">No deleted teams.</p>
  } @else {
    <div class="deleted-teams__list">
      @for (team of teams(); track team.id) {
        <div class="deleted-teams__row">
          <div class="deleted-teams__info">
            <span class="deleted-teams__name">{{ team.name }}</span>
            <span class="deleted-teams__meta">Deleted {{ team.deletedAt | date: 'medium' }}</span>
          </div>
          <button mat-flat-button color="primary" (click)="restore(team)">
            <mat-icon>restore</mat-icon>
            Restore
          </button>
        </div>
      }
    </div>
  }
</div>
