<div class="player-card" [class]="'player-card--' + rarityTier()">
  <div class="player-card__photo">
    @if (player().imageUrl) {
      <img [src]="player().imageUrl" [alt]="player().name" />
    } @else {
      <span class="player-card__initial">{{ player().name.charAt(0) }}</span>
    }
  </div>

  <h2 class="player-card__name">{{ player().name }}</h2>
  <span class="player-card__meta">
    {{ player().role }}
    @if (player().previousTeam) {
      · {{ player().previousTeam }}
    }
    · Class of {{ player().passingYear }}
  </span>


  <div class="player-card__base-price">
    <span class="player-card__base-price-label">Base Price</span>
    <span class="player-card__base-price-value">{{ player().basePrice }}</span>
  </div>
</div>
