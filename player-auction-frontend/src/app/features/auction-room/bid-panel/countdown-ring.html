<svg class="countdown-ring" [class.countdown-ring--critical]="isCritical()" viewBox="0 0 100 100">
  <g class="countdown-ring__rotator">
    <circle class="countdown-ring__track" cx="50" cy="50" [attr.r]="radius" />
    <circle
      class="countdown-ring__progress"
      cx="50"
      cy="50"
      [attr.r]="radius"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="progressOffset()"
    />
  </g>
  <text class="countdown-ring__text" x="50" y="58" text-anchor="middle">{{ secondsRemaining() }}</text>
</svg>
