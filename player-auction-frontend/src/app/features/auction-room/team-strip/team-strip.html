<div class="team-strip">
  @for (team of teams(); track team.id) {
    <div class="team-strip__item" [class.team-strip__item--active]="team.id === highlightedTeamId()">
      <span class="team-strip__name">{{ team.shortName }}</span>
      <span class="team-strip__budget">{{ team.remainingBudget }}</span>
      <div class="team-strip__meter">
        <div class="team-strip__meter-fill" [style.width.%]="budgetUsedPercent(team)"></div>
      </div>
    </div>
  }
</div>
