<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <div class="shell__brand">
      <mat-icon>sports_soccer</mat-icon>
      <span>Player Auction</span>
    </div>

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="shell__nav-item--active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <mat-toolbar class="shell__toolbar">
      <span class="shell__spacer"></span>
      @if (currentUser(); as user) {
        <span class="shell__user">{{ user.name }}</span>
      }
      <button mat-icon-button (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
