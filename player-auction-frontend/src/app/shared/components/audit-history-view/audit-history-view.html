<div class="audit-history">
  <div class="audit-history__header">
    <button mat-icon-button [routerLink]="[backPath(), entityId()]" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Audit History</h1>
  </div>

  @if (isLoading()) {
    <p class="audit-history__loading">Loading history...</p>
  } @else if (entries().length === 0) {
    <p class="audit-history__empty">No recorded actions yet.</p>
  } @else {
    <div class="audit-history__timeline">
      @for (entry of entries(); track entry.id) {
        <div class="audit-history__entry">
          <mat-icon class="audit-history__entry-icon">{{ iconFor(entry.action) }}</mat-icon>
          <div class="audit-history__entry-body">
            <span class="audit-history__entry-action">{{ entry.action }}</span>
            <span class="audit-history__entry-time">{{ entry.createdAt | date: 'medium' }}</span>
          </div>
        </div>
      }
    </div>
  }
</div>
